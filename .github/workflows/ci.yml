name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci || npm install
      - name: Validate stub scripts
        run: bash -n test/sandbox/stubs/rclone test/sandbox/stubs/timeshift test/sandbox/stubs/sudo test/sandbox/stubs/systemctl test/sandbox/stubs/curl
      - name: Run tests
        run: npm test
      - name: Package dry-run
        run: npm publish --dry-run --access public